[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tr6s"
version = "0.1.0"
description = "Drive a Roland TR-6S over USB: patterns, kits, melodies, and an LLM-facing tool surface"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["tr-6s", "roland", "midi", "sysex", "drum-machine", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = []

[project.optional-dependencies]
chat = ["anthropic>=0.40"]
dev = ["pytest>=7"]

[project.scripts]
tr6s = "tr6s.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tr6s = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
