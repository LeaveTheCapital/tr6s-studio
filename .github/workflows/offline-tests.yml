name: Offline tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # pyproject.toml requires >=3.10. 3.12 is the version this port is
          # developed and tested with.
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run offline tests
        env:
          # all: every offline test under tests/, excluding tests/hardware/.
          # verified: only test_tr6s*.py (port contract plus kit inspect/diff).
          OFFLINE_SCOPE: all
        run: |
          set -eu
          case "$OFFLINE_SCOPE" in
            verified)
              PYTHONPATH=src python -m unittest discover -s tests -p 'test_tr6s*.py' -v
              ;;
            all)
              python -m pytest tests --ignore=tests/hardware -v
              ;;
            *)
              echo "unknown OFFLINE_SCOPE=$OFFLINE_SCOPE" >&2
              exit 1
              ;;
          esac
